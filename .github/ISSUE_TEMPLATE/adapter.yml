name: Adapter request or correction
description: Propose loading semantics backed by an official source
labels: [adapter]
body:
  - type: input
    id: engine
    attributes:
      label: Engine and version
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official documentation URL
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Loading rule and uncertainty
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal fixture layout
    validations:
      required: true
