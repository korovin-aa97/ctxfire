<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#35201c"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5f56"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" rx="36" fill="url(#bg)"/>
  <circle cx="930" cy="90" r="270" fill="#ff8a5c" opacity="0.13"/>
  <circle cx="970" cy="970" r="320" fill="#ff784f" opacity="0.08"/>

  <text x="72" y="92" fill="url(#fire)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">OPEN SOURCE · LOCAL ONLY</text>
  <text x="72" y="212" fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">ctxfire</text>
  <text x="72" y="270" fill="#bdd1dd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30">What does each coding agent</text>
  <text x="72" y="310" fill="#bdd1dd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30">load every day?</text>

  <g filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="180" y="390" width="720" height="104" rx="20" fill="#241d22" stroke="#9b5b48"/>
    <text x="540" y="452" text-anchor="middle" fill="#fff3ed" font-size="24">agent → versioned adapter@1</text>

    <path d="M540 494 V540" fill="none" stroke="#ff9566" stroke-width="5"/>
    <path d="M527 527 L540 543 L553 527" fill="none" stroke="#ff9566" stroke-width="5"/>

    <rect x="180" y="543" width="720" height="118" rx="20" fill="#241d22" stroke="#9b5b48"/>
    <text x="540" y="595" text-anchor="middle" fill="#fff3ed" font-size="24">context candidates</text>
    <text x="540" y="630" text-anchor="middle" fill="#c6aaa0" font-size="19">exact paths · exact byte sizes · explainable edges</text>

    <path d="M540 661 V707" fill="none" stroke="#ff9566" stroke-width="5"/>
    <path d="M527 694 L540 710 L553 694" fill="none" stroke="#ff9566" stroke-width="5"/>

    <rect x="180" y="710" width="720" height="132" rx="20" fill="#30201f" stroke="#ff8b61" stroke-width="2"/>
    <text x="540" y="768" text-anchor="middle" fill="#fff8f4" font-size="25">tokens/fire × fires/day</text>
    <text x="540" y="808" text-anchor="middle" fill="#c6aaa0" font-size="19">estimate with visible assumptions</text>
  </g>

  <text x="72" y="928" fill="#86a9ba" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Codex · Claude Code · AGENTS.md · JSON · SARIF</text>
  <text x="72" y="990" fill="#d9e6ec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">github.com/korovin-aa97/ctxfire</text>
</svg>
