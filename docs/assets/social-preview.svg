    <path d="M342 405 L356 416 L342 427" fill="none" stroke="#ff9566" stroke-width="4"/>

    <rect x="356" y="370" width="212" height="92" rx="18" fill="#241d22" stroke="#9b5b48"/>
    <text x="462" y="425" text-anchor="middle" fill="#fff3ed">adapter@1</text>
    <path d="M568 416 H632" stroke="#ff9566" stroke-width="4"/>
    <path d="M622 405 L636 416 L622 427" fill="none" stroke="#ff9566" stroke-width="4"/>

